# Application-core configuration used only by build.sh --gatt and bsim.sh --gatt.
# The controller is the separate generic Zephyr hci_ipc network-core image.
CONFIG_MB_BLE_CENTRAL=y
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_GATT_CLIENT=y

# Honor the application-code partition selected by the raw nRF7002 DK overlay.
CONFIG_USE_DT_CODE_PARTITION=y
# The selected board derives BT_HCI_IPC from its Bluetooth/DT configuration.
# Do not assign this promptless transport symbol directly.
CONFIG_BT_SMP=n

# Keep application-local, generation-scoped discovery state instead of a
# persistent credential-bearing GATT cache.
CONFIG_BT_GATT_CACHING=n
# Preserve the dedicated Wi-Fi and TLS pools. Bound the shared application
# heap independently of the 448 KiB application-RAM region and shared Bluetooth IPC pool.
CONFIG_HEAP_MEM_POOL_SIZE=155648
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_OFF=y
CONFIG_BT_ATT_LOG_LEVEL_OFF=y
CONFIG_BT_GATT_LOG_LEVEL_OFF=y
CONFIG_BT_L2CAP_LOG_LEVEL_OFF=y
CONFIG_BT_CONN_LOG_LEVEL_OFF=y
